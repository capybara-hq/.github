name: Feature request
description: Suggest an improvement or a new capability
labels: [needs-triage, enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: What you would like to see.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you looked at.
    validations:
      required: false
